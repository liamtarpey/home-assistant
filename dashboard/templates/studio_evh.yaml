studio_evh:
  triggers_update:
    - switch.office_studio_power_speakers_and_amps_evh_5150iii
    - binary_sensor.office_power_evh_5150iii_overheated
    - binary_sensor.office_power_evh_5150iii_overloaded
    - sensor.office_power_evh_5150iii_current_consumption
  variables:
    title_text: EVH 5150III
    sw: switch.office_studio_power_speakers_and_amps_evh_5150iii
    pw: sensor.office_power_evh_5150iii_current_consumption
    hot: binary_sensor.office_power_evh_5150iii_overheated
    over: binary_sensor.office_power_evh_5150iii_overloaded
    input: "INPUT: 24A"
  label: >
    [[[
      const bad = states[variables.hot]?.state === 'on' ? 'OVERHEATED' : states[variables.over]?.state === 'on' ? 'OVERLOADED' : '';
      if (bad) return '<span style="color:#ff6b5e;font-weight:700">' + bad + '</span>';
      const inp = variables.input ? ` · ${variables.input}` : '';
      const st = states[variables.sw]?.state;
      if (!st || ['unavailable', 'unknown'].includes(st)) return 'NOT REACHABLE' + inp;
      if (st !== 'on') return 'OFF' + inp;
      const w = parseFloat(states[variables.pw]?.state);
      const dot = '<span class="live-wrap"><span class="live-ring"></span><span class="live-dot"></span></span>';
      return dot + (isNaN(w) ? 'ON' : `ON · ${Math.round(w)} W`) + inp;
    ]]]
  name: >
    [[[
      const st = states[variables.sw]?.state;
      if (!st || ['unavailable', 'unknown'].includes(st)) return 'EVH5150 offline';
      return st === 'on' ? 'EVH5150 on' : 'EVH5150 off';
    ]]]
  custom_fields:
    art: >
