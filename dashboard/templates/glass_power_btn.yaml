glass_power_btn:
  show_name: false
  show_icon: false
  custom_fields:
    p: >
      [[[
        const off = !!variables.is_off;
        const path = 'M16.56,5.44L15.11,6.89C16.84,7.94 18,9.83 18,12A6,6 0 0,1 12,18A6,6 0 0,1 6,12C6,9.83 7.16,7.94 8.88,6.88L7.44,5.44C5.36,6.88 4,9.28 4,12A8,8 0 0,0 12,20A8,8 0 0,0 20,12C20,9.28 18.64,6.88 16.56,5.44M13,3H11V13H13';
        const slash = off ? '<line x1="3.5" y1="3.5" x2="20.5" y2="20.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>' : '';
        return `<svg viewBox="0 0 24 24" width="22" height="22" style="color:${off ? 'rgba(255,255,255,0.8)' : '#ffffff'};display:block"><path d="${path}" fill="currentColor"/>${slash}</svg>`;
      ]]]
  styles:
    card:
      - width: 46px
      - height: 46px
      - padding: 0
      - border: none
      - border-radius: 50%
      - box-shadow: none
      - background: "[[[ return variables.is_off ? 'rgba(139,143,152,0.35)' : 'rgba(255,255,255,0.14)'; ]]]"
    grid:
      - grid-template-areas: '"p"'
      - place-items: center
    custom_fields:
      p:
        - display: flex
        - align-items: center
        - justify-content: center
