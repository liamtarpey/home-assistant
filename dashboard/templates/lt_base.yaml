lt_base:
  show_name: false
  show_icon: false
  tap_action:
    action: none
  variables:
    icons: |
      [[[
        return {lamp: '<path d="M8 3h8l3 9H5z"/><rect x="11" y="12" width="2" height="6"/><rect x="7" y="18" width="10" height="2.5" rx="1"/>', candle: '<path d="M12 2c1.3 2-1 3-1 5a1 1 0 0 0 2 0c0-.6-.3-1-.6-1.4C13.6 6 15 7.4 15 9a3 3 0 0 1-6 0c0-3 2.5-4.5 3-7z"/><rect x="8" y="11.5" width="8" height="10" rx="1.5"/>', uplight: '<path d="M7 3.5h10l-2 6h-6z"/><rect x="11.2" y="9.5" width="1.6" height="9"/><rect x="8" y="18.5" width="8" height="2.5" rx="1"/>', strip: '<rect x="2" y="9" width="20" height="6" rx="3"/><circle cx="7" cy="12" r="1" fill="#12141a"/><circle cx="12" cy="12" r="1" fill="#12141a"/><circle cx="17" cy="12" r="1" fill="#12141a"/>'};
      ]]]
  styles:
    card:
      - background: rgb(18,20,26)
      - border: none
      - border-radius: 18px
      - box-shadow: none
      - padding: 0
      - overflow: hidden
      - height: auto
      - cursor: default
    grid:
      - grid-template-areas: '"body"'
      - grid-template-columns: minmax(0, 1fr)
    custom_fields:
      body:
        - justify-self: stretch
        - align-self: stretch
        - width: 100%
        - min-width: 0
  extra_styles: |
    .lt { position: relative; box-sizing: border-box; color: #ffffff; font-family: Roboto, system-ui, sans-serif; text-align: left; }
    .lt-glow { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; }
    .lt-glow.br { transform-origin: 80% 15%; animation: lt-breathe 7s ease-in-out infinite; }
    .lt-ttl { position: relative; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.7); }
    .lt-big { position: relative; display: flex; align-items: center; gap: 12px; margin-top: 8px; font-size: 38px; font-weight: 700; line-height: 1.1; white-space: nowrap; }
    .lt-big svg { flex: none; }
    .lt-sub { font-size: 14px; font-weight: 400; color: rgba(255,255,255,0.7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lt-tile { position: relative; box-sizing: border-box; height: 96px; padding: 12px; overflow: hidden; color: #ffffff; font-family: Roboto, system-ui, sans-serif; text-align: left; }
    .lt-ic { position: relative; display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; }
    .lt-nm { position: relative; margin-top: 9px; font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lt-st { position: relative; margin-top: 2px; font-size: 12px; color: rgba(255,255,255,0.7); }
    .lt-gd { position: absolute; top: 12px; right: 12px; width: 8px; height: 8px; border-radius: 50%; animation: lt-glp 3.4s ease-in-out infinite; }
    .lt-head { position: relative; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 18px 22px 0; color: #ffffff; font-family: Roboto, system-ui, sans-serif; text-align: left; }
    .lt-hic { display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 50%; flex: none; }
    .lt-hn { font-size: 18px; font-weight: 700; line-height: 1.1; }
    .lt-hs { margin-top: 2px; font-size: 13px; color: rgba(255,255,255,0.7); }
    .lt-tg { position: relative; margin-left: auto; width: 54px; height: 30px; border-radius: 15px; flex: none; }
    .lt-tg i { position: absolute; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #ffffff; box-shadow: 0 1px 4px rgba(0,0,0,0.4); }
    @media (max-width: 560px) {
      .lt-tile .lt-nm, .lt-tile .lt-st { display: none; }
      .lt-tile { display: flex; align-items: center; justify-content: center; padding: 8px 0; }
      .lt-big { font-size: 30px; }
    }
    @keyframes lt-breathe { 0%, 100% { opacity: 0.7; transform: scale(1); } 50% { opacity: 1; transform: scale(1.1); } }
    @keyframes lt-glp { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }

