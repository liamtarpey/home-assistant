tfl_hero:
  triggers_update:
    [sensor.london_underground_bakerloo, sensor.london_underground_central, sensor.london_underground_circle, sensor.london_underground_district, sensor.london_underground_dlr, sensor.london_underground_elizabeth_line, sensor.london_underground_hammersmith_city, sensor.london_underground_jubilee, sensor.london_underground_metropolitan, sensor.london_underground_northern, sensor.london_underground_piccadilly, sensor.london_underground_victoria, sensor.london_underground_waterloo_city, sensor.london_underground_tram]
  custom_fields:
    body: |
      [[[
        const L = variables.lines;
        const esc = (t) => String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const isGood = (s) => s === 'Good Service';
        const isGone = (s) => !s || s === 'unavailable' || s === 'unknown';
        const isRed = (s) => /severe|suspend|closed/i.test(s) && !/part|planned/i.test(s);
        const isClosed = (s) => /^service closed$/i.test(s || '');
        let latest = 0, gone = 0, closed = 0;
        const bad = [];
        for (const l of L) {
          const s = states[l.e];
          if (!s) { gone++; continue; }
          if (isGone(s.state)) gone++;
          const t = Date.parse(s.last_updated);
          if (t > latest) latest = t;
          if (isClosed(s.state)) { closed++; continue; }
          if (!isGood(s.state) && !isGone(s.state)) bad.push({l: l, st: s.state, red: isRed(s.state)});
        }
        const n = bad.length;
        const running = L.length - gone - closed - n;
        const allClosed = n === 0 && closed > 0 && running <= 0;
        const glow = n === 0 ? (allClosed ? '99,102,241' : '61,220,132') : bad.some(b => b.red) ? '255,90,77' : '255,176,32';
        const upd = latest ? new Date(latest).toLocaleTimeString('en-GB', {hour: '2-digit', minute: '2-digit'}) : '--:--';
        const title = n > 0 ? (n === 1 ? '1 line disrupted' : `${n} lines disrupted`) : allClosed ? 'Closed for the night' : closed ? 'Good service on running lines' : 'Good service on all lines';
        const moon = (s) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true" style="color:#9fa8ff;flex:none;vertical-align:middle"><path d="M17.75,4.09L15.22,6.03L16.13,9.09L13.5,7.28L10.87,9.09L11.78,6.03L9.25,4.09L12.44,4L13.5,1L14.56,4L17.75,4.09M21.25,11L19.61,12.25L20.2,14.23L18.5,13.06L16.8,14.23L17.39,12.25L15.75,11L17.81,10.95L18.5,9L19.19,10.95L21.25,11M18.97,15.95C19.8,15.87 20.69,17.05 20.16,17.8C19.84,18.25 19.5,18.67 19.08,19.07C15.17,23 8.84,23 4.94,19.07C1.03,15.17 1.03,8.83 4.94,4.93C5.34,4.53 5.76,4.17 6.21,3.85C6.96,3.32 8.14,4.21 8.06,5.04C7.79,7.9 8.75,10.87 10.95,13.06C13.14,15.26 16.1,16.22 18.97,15.95M17.33,17.97C14.5,17.81 11.7,16.64 9.53,14.5C7.36,12.31 6.2,9.5 6.04,6.68C3.23,9.82 3.34,14.64 6.35,17.66C9.37,20.67 14.19,20.79 17.33,17.97Z" fill="currentColor"/></svg>`;
        const dot = '<span class="tf-dw"><span class="tf-dr"></span><span class="tf-dc"></span></span>';
        const closedChip = closed ? `<span class="tf-chip" style="background:rgba(99,102,241,0.2)">${moon(16)}${closed} ${closed === 1 ? 'line' : 'lines'} closed overnight</span>` : '';
        const okText = (gone || closed) ? `${running} ${running === 1 ? 'line' : 'lines'} running normally${gone ? ' · ' + gone + ' not reporting' : ''}` : 'All ' + L.length + ' lines running normally';
        const chips = n === 0
          ? (allClosed ? '' : `<span class="tf-chip">${dot}${okText}</span>`) + closedChip
          : bad.map(b => `<span class="tf-chip"><img src="/local/svg/tfl/roundel-${b.l.i}-no-text.svg" alt="">${b.l.n} · ${esc(b.st)}</span>`).join('') + closedChip;
        const rib = L.map(l => {
          const s = states[l.e] ? states[l.e].state : '';
          const col = isGone(s) ? 'rgba(255,255,255,0.2)' : isClosed(s) ? 'rgba(255,255,255,0.14)' : l.c;
          return `<i class="tf-seg${(!isGood(s) && !isGone(s) && !isClosed(s)) ? ' bad' : ''}" style="background:${col}"></i>`;
        }).join('');
        return `<div class="tf"><div class="tf-glow" style="background:radial-gradient(circle at 88% 0%, rgba(${glow},0.34) 0%, rgba(${glow},0) 62%)"></div>`
          + `<div class="tf-head"><span class="tf-ttl">Transport for London</span><span class="tf-upd">${dot}Updated ${upd}</span></div>`
          + `<div class="tf-big">${allClosed ? moon(30) + '<span style="margin-left:12px">' + title + '</span>' : title}</div><div class="tf-chips">${chips}</div>`
          + `<div class="tf-ribw"><div class="tf-rib">${rib}</div></div></div>`;
      ]]]
