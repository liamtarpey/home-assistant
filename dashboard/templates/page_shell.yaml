page_shell:
  show_name: false
  show_icon: false
  tap_action:
    action: none
  styles:
    card:
      - background: none
      - border: none
      - box-shadow: none
      - border-radius: 0
      - padding: 0
      - overflow: hidden
      - width: 100%
      - max-width: 100%
      - box-sizing: border-box
      - height: calc(100vh - var(--header-height, 56px) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - var(--page-extra, 0px))
      - height: calc(100dvh - var(--header-height, 56px) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - var(--page-extra, 0px))
    grid:
      - grid-template-columns: repeat(3, minmax(0, 1fr))
      - grid-template-rows: auto minmax(0, 1fr)
      - gap: 24px
      - width: 100%
      - height: 100%
      - box-sizing: border-box
      - padding: 20px 24px 2px
      - align-items: start
    custom_fields:
      hero:
        - justify-self: stretch
        - align-self: start
        - min-width: 0
      side:
        - justify-self: stretch
        - align-self: start
        - min-width: 0
      a:
        - justify-self: stretch
        - align-self: stretch
        - min-width: 0
        - min-height: 0
        - overflow-y: auto
        - overscroll-behavior: contain
        - scrollbar-width: none
        - -webkit-overflow-scrolling: touch
        - padding-bottom: 28px
        - --stack-card-gap: 24px
      b:
        - justify-self: stretch
        - align-self: stretch
        - min-width: 0
        - min-height: 0
        - overflow-y: auto
        - overscroll-behavior: contain
        - scrollbar-width: none
        - -webkit-overflow-scrolling: touch
        - padding-bottom: 28px
        - --stack-card-gap: 24px
      c:
        - justify-self: stretch
        - align-self: stretch
        - min-width: 0
        - min-height: 0
        - overflow-y: auto
        - overscroll-behavior: contain
        - scrollbar-width: none
        - -webkit-overflow-scrolling: touch
        - padding-bottom: 28px
        - --stack-card-gap: 24px
  extra_styles: |
    :host { display: block !important; width: 100% !important; max-width: none !important; min-width: 0 !important; --page-extra: 32px; }
    @media (max-width: 900px) {
      ha-card { height: auto !important; overflow: visible !important; }
      #container {
        height: auto !important;
        padding: 16px !important;
        grid-template-rows: none !important;
        grid-template-columns: minmax(0, 1fr) !important;
        grid-template-areas: "hero" "side" "a" "b" "c" !important;
      }
    }
