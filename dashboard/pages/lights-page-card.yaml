            entity: light.lounge_lounge_candle
            custom_fields:
              head:
                card: {type: custom:button-card, template: [lt_base, lt_head], entity: light.lounge_lounge_candle, variables: {name: 'Candle', kind: candle}}
              bri:
                card: {type: tile, entity: light.lounge_lounge_candle, name: Brightness, hide_state: true, vertical: false, features: [{type: light-brightness}]}
              sw:
