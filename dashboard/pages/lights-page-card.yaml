# Lounge lights view card (view type: Panel)
grid_options:
  columns: full
type: custom:button-card
template: page_shell
styles:
  grid:
    - grid-template-areas: '"hero hero side" "a a a"'
custom_fields:
  hero:
    card:
      type: custom:button-card
      template:
        - lt_base
        - lt_hero
        - glass_cta
      styles:
        card:
          - height: 250px
        grid:
          - grid-template-areas: '"top" "tiles"'
          - grid-template-columns: minmax(0, 1fr)
          - grid-template-rows: min-content 1fr
          - position: relative
        custom_fields:
          fx:
            - position: absolute
            - top: 0
            - left: 0
            - right: 0
            - bottom: 0
            - pointer-events: none
          top:
            - position: relative
            - z-index: 2
            - justify-self: stretch
            - min-width: 0
          tiles:
            - position: relative
            - z-index: 3
            - justify-self: stretch
            - min-width: 0
            - align-self: end
            - margin: 0 22px 22px 22px
            - --stack-card-gap: 12px
      custom_fields:
        cta:
          card:
            type: custom:button-card
            template: glass_power_btn
            entity: light.all_lounge_lights
            variables:
              is_off: "[[[ return (states['light.all_lounge_lights'] ? states['light.all_lounge_lights'].state : 'off') !== 'on'; ]]]"
            tap_action:
              action: perform-action
              perform_action: light.toggle
              target:
                entity_id: light.all_lounge_lights
        tiles:
          card:
            type: horizontal-stack
            cards:
                - {type: custom:button-card, template: [lt_base, lt_tile], entity: light.wiz_rgbw_tunable_181e98, variables: {name: 'Big lamp', kind: lamp}}
                - {type: custom:button-card, template: [lt_base, lt_tile], entity: light.lounge_lounge_candle, variables: {name: 'Candle', kind: candle}}
                - {type: custom:button-card, template: [lt_base, lt_tile], entity: light.wiz_rgbw_tunable_19f62e, variables: {name: 'TV uplight', kind: uplight}}
                - {type: custom:button-card, template: [lt_base, lt_tile], entity: light.wiz_rgbw_tunable_1a3d76, variables: {name: 'Couch uplight', kind: uplight}}
                - {type: custom:button-card, template: [lt_base, lt_tile], entity: light.lounge_lightstrip_left, variables: {name: 'Strip left', kind: strip}}
                - {type: custom:button-card, template: [lt_base, lt_tile], entity: light.lounge_lightstrip_right, variables: {name: 'Strip right', kind: strip}}
  side:
    card: {type: custom:button-card, template: [glass_card, glass_dim, glass_title, glass_cta, glass_bigicon, lounge_scene]}
  a:
    card:
      type: custom:button-card
      show_name: false
      show_icon: false
      tap_action:
        action: none
      styles:
        card:
          - background: none
          - border: none
          - box-shadow: none
          - padding: 0
          - overflow: visible
          - height: auto
        grid:
          - grid-template-areas: '"l1 l2 l3" "l4 l5 l6"'
          - grid-template-columns: repeat(3, minmax(0, 1fr))
          - gap: 24px
          - align-items: start
        custom_fields:
          l1:
            - justify-self: stretch
            - min-width: 0
          l2:
            - justify-self: stretch
            - min-width: 0
          l3:
            - justify-self: stretch
            - min-width: 0
          l4:
            - justify-self: stretch
            - min-width: 0
          l5:
            - justify-self: stretch
            - min-width: 0
          l6:
            - justify-self: stretch
            - min-width: 0
      extra_styles: |
        @media (max-width: 900px) {
          #container {
            grid-template-areas: "l1" "l2" "l3" "l4" "l5" "l6" !important;
            grid-template-columns: minmax(0, 1fr) !important;
          }
        }
      custom_fields:
        l1:
          card:
            type: custom:button-card
            template:
              - lt_base
              - lt_card
            entity: light.wiz_rgbw_tunable_181e98
            custom_fields:
              head:
                card: {type: custom:button-card, template: [lt_base, lt_head], entity: light.wiz_rgbw_tunable_181e98, variables: {name: 'Big lamp', kind: lamp}}
              bri:
                card: {type: tile, entity: light.wiz_rgbw_tunable_181e98, name: Brightness, hide_state: true, vertical: false, features: [{type: light-brightness}]}
              sw:
                card: {type: horizontal-stack, cards: [{type: custom:button-card, template: lt_sw_candle, variables: {e: light.wiz_rgbw_tunable_181e98}}, {type: custom:button-card, template: lt_sw_warm, variables: {e: light.wiz_rgbw_tunable_181e98}}, {type: custom:button-card, template: lt_sw_neutral, variables: {e: light.wiz_rgbw_tunable_181e98}}, {type: custom:button-card, template: lt_sw_cool, variables: {e: light.wiz_rgbw_tunable_181e98}}, {type: custom:button-card, template: lt_sw_pink, variables: {e: light.wiz_rgbw_tunable_181e98}}, {type: custom:button-card, template: lt_sw_blue, variables: {e: light.wiz_rgbw_tunable_181e98}}, {type: custom:button-card, template: lt_sw_green, variables: {e: light.wiz_rgbw_tunable_181e98}}, {type: custom:button-card, template: lt_more, entity: light.wiz_rgbw_tunable_181e98}]}
        l2:
