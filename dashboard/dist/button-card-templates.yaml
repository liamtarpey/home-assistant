          const isGone = (s) => !s || s === 'unavailable' || s === 'unknown';
          const isRed = (s) => /severe|suspend|closed/i.test(s) && !/part|planned/i.test(s);
          const isClosed = (s) => /^service closed$/i.test(s || '');
