      body: |
        [[[
          const rows = [['sensor.dlr_stratford_high_street_northbound', 'To Stratford Intl'], ['sensor.dlr_stratford_high_street_southbound', 'To Woolwich']];
          const rowsHtml = rows.map(r => {
            const m = parseFloat(states[r[0]] ? states[r[0]].state : '');
            const ok = !isNaN(m);
            const frac = ok ? Math.min(96, Math.max(8, (1 - m / 15) * 100)) : 0;
            const track = ok
              ? `<div class="tf-tk"><div class="tf-tf" style="width:${frac.toFixed(0)}%"></div><i class="tf-td" style="left:${frac.toFixed(0)}%"></i></div>`
              : '<div class="tf-tk"></div>';
            const mins = ok ? `<b>${Math.round(m)}</b><span>min</span>` : '<span>No trains</span>';
            return `<div class="tf-dl"><img src="/local/svg/tfl/roundel-dlr-no-text.svg" alt=""><div class="tf-dm"><div class="tf-dn">${r[1]}</div>${track}</div><div class="tf-mins">${mins}</div></div>`;
          }).join('');
          return `<div class="tf"><div class="tf-glow" style="background:radial-gradient(circle at 90% 8%, rgba(0,164,167,0.36) 0%, rgba(0,164,167,0) 60%)"></div>`
            + `<div class="tf-head"><span class="tf-ttl">Next DLR · Stratford High St</span></div>${rowsHtml}</div>`;
        ]]]
  tfl_hero:
    triggers_update:
      [sensor.london_underground_bakerloo, sensor.london_underground_central, sensor.london_underground_circle, sensor.london_underground_district, sensor.london_underground_dlr, sensor.london_underground_elizabeth_line, sensor.london_underground_hammersmith_city, sensor.london_underground_jubilee, sensor.london_underground_metropolitan, sensor.london_underground_northern, sensor.london_underground_piccadilly, sensor.london_underground_victoria, sensor.london_underground_waterloo_city, sensor.london_underground_tram]
    custom_fields:
      body: |
        [[[
          const L = variables.lines;
          const esc = (t) => String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          const isGood = (s) => s === 'Good Service';
          const isGone = (s) => !s || s === 'unavailable' || s === 'unknown';
          const isRed = (s) => /severe|suspend|closed/i.test(s) && !/part|planned/i.test(s);
          const isClosed = (s) => /^service closed$/i.test(s || '');
          let latest = 0, gone = 0, closed = 0;
          const bad = [];
          for (const l of L) {
            const s = states[l.e];
            if (!s) { gone++; continue; }
            if (isGone(s.state)) gone++;
            const t = Date.parse(s.last_updated);
            if (t > latest) latest = t;
            if (isClosed(s.state)) { closed++; continue; }
            if (!isGood(s.state) && !isGone(s.state)) bad.push({l: l, st: s.state, red: isRed(s.state)});
          }
          const n = bad.length;
          const running = L.length - gone - closed - n;
          const allClosed = n === 0 && closed > 0 && running <= 0;
          const glow = n === 0 ? (allClosed ? '99,102,241' : '61,220,132') : bad.some(b => b.red) ? '255,90,77' : '255,176,32';
          const upd = latest ? new Date(latest).toLocaleTimeString('en-GB', {hour: '2-digit', minute: '2-digit'}) : '--:--';
          const title = n > 0 ? (n === 1 ? '1 line disrupted' : `${n} lines disrupted`) : allClosed ? 'Closed for the night' : closed ? 'Good service on running lines' : 'Good service on all lines';
          const moon = (s) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true" style="color:#9fa8ff;flex:none;vertical-align:middle"><path d="M17.75,4.09L15.22,6.03L16.13,9.09L13.5,7.28L10.87,9.09L11.78,6.03L9.25,4.09L12.44,4L13.5,1L14.56,4L17.75,4.09M21.25,11L19.61,12.25L20.2,14.23L18.5,13.06L16.8,14.23L17.39,12.25L15.75,11L17.81,10.95L18.5,9L19.19,10.95L21.25,11M18.97,15.95C19.8,15.87 20.69,17.05 20.16,17.8C19.84,18.25 19.5,18.67 19.08,19.07C15.17,23 8.84,23 4.94,19.07C1.03,15.17 1.03,8.83 4.94,4.93C5.34,4.53 5.76,4.17 6.21,3.85C6.96,3.32 8.14,4.21 8.06,5.04C7.79,7.9 8.75,10.87 10.95,13.06C13.14,15.26 16.1,16.22 18.97,15.95M17.33,17.97C14.5,17.81 11.7,16.64 9.53,14.5C7.36,12.31 6.2,9.5 6.04,6.68C3.23,9.82 3.34,14.64 6.35,17.66C9.37,20.67 14.19,20.79 17.33,17.97Z" fill="currentColor"/></svg>`;
          const dot = '<span class="tf-dw"><span class="tf-dr"></span><span class="tf-dc"></span></span>';
          const closedChip = closed ? `<span class="tf-chip" style="background:rgba(99,102,241,0.2)">${moon(16)}${closed} ${closed === 1 ? 'line' : 'lines'} closed overnight</span>` : '';
          const okText = (gone || closed) ? `${running} ${running === 1 ? 'line' : 'lines'} running normally${gone ? ' · ' + gone + ' not reporting' : ''}` : 'All ' + L.length + ' lines running normally';
          const chips = n === 0
            ? (allClosed ? '' : `<span class="tf-chip">${dot}${okText}</span>`) + closedChip
            : bad.map(b => `<span class="tf-chip"><img src="/local/svg/tfl/roundel-${b.l.i}-no-text.svg" alt="">${b.l.n} · ${esc(b.st)}</span>`).join('') + closedChip;
          const rib = L.map(l => {
            const s = states[l.e] ? states[l.e].state : '';
            const col = isGone(s) ? 'rgba(255,255,255,0.2)' : isClosed(s) ? 'rgba(255,255,255,0.14)' : l.c;
            return `<i class="tf-seg${(!isGood(s) && !isGone(s) && !isClosed(s)) ? ' bad' : ''}" style="background:${col}"></i>`;
          }).join('');
          return `<div class="tf"><div class="tf-glow" style="background:radial-gradient(circle at 88% 0%, rgba(${glow},0.34) 0%, rgba(${glow},0) 62%)"></div>`
            + `<div class="tf-head"><span class="tf-ttl">Transport for London</span><span class="tf-upd">${dot}Updated ${upd}</span></div>`
            + `<div class="tf-big">${allClosed ? moon(30) + '<span style="margin-left:12px">' + title + '</span>' : title}</div><div class="tf-chips">${chips}</div>`
            + `<div class="tf-ribw"><div class="tf-rib">${rib}</div></div></div>`;
        ]]]
  tfl_ok:
    custom_fields:
      body: |
        [[[
          return `<div class="tf" style="min-height:190px"><div class="tf-glow" style="background:radial-gradient(circle at 90% 8%, rgba(61,220,132,0.28) 0%, rgba(61,220,132,0) 60%)"></div>`
            + `<div class="tf-head"><span class="tf-ttl">Warnings</span></div>`
            + `<div class="tf-okr"><div class="tf-okc"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.5 2 2 6.5 2 12S6.5 22 12 22 22 17.5 22 12 17.5 2 12 2M10 17L5 12L6.41 10.59L10 14.17L17.59 7.58L19 9L10 17Z" fill="currentColor"/></svg></div>`
            + `<div><div class="tf-okt">No warnings</div><div class="tf-oks">Nothing to report on any line</div></div></div></div>`;
        ]]]
  tfl_open:
    triggers_update:
      [sensor.london_underground_bakerloo, sensor.london_underground_central, sensor.london_underground_circle, sensor.london_underground_district, sensor.london_underground_dlr, sensor.london_underground_elizabeth_line, sensor.london_underground_hammersmith_city, sensor.london_underground_jubilee, sensor.london_underground_metropolitan, sensor.london_underground_northern, sensor.london_underground_piccadilly, sensor.london_underground_victoria, sensor.london_underground_waterloo_city, sensor.london_underground_tram]
    custom_fields:
      body: |
        [[[
          const L = variables.lines;
          const isGood = (s) => s === 'Good Service';
          const isGone = (s) => !s || s === 'unavailable' || s === 'unknown';
          const isClosed = (s) => /^service closed$/i.test(s || '');
          const rows = L.map(l => {
            const s = states[l.e] ? states[l.e].state : '';
            const k = isGone(s) ? 'gone' : isClosed(s) ? 'closed' : isGood(s) ? 'good' : 'bad';
            return {l: l, s: s, k: k};
          });
          const cnt = (k) => rows.filter(r => r.k === k).length;
          const good = cnt('good'), bad = cnt('bad'), closed = cnt('closed'), gone = cnt('gone');
          const total = rows.length, open = good + bad;
          const glow = bad ? '255,176,32' : open === 0 ? '99,102,241' : '61,220,132';
          const dot = '<span class="tf-dw"><span class="tf-dr"></span><span class="tf-dc"></span></span>';
          const R = 60, C = 2 * Math.PI * R;
          let off = 0;
          const segs = [[good, '#3ddc84'], [bad, '#ffb020'], [closed, '#7c83ff'], [gone, 'rgba(255,255,255,0.2)']].filter(x => x[0] > 0).map(x => {
            const part = x[0] / total * C;
            const len = Math.max(0, part - (total > 1 ? 4 : 0));
            const c = `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${x[1]}" stroke-width="14" stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 70 70)"/>`;
            off += part;
            return c;
          }).join('');
          const order = {good: 0, bad: 1, closed: 2, gone: 3};
          const roundels = rows.slice().sort((a, b) => order[a.k] - order[b.k]).map(r => {
            const st = r.k === 'closed' ? 'opacity:0.22;filter:grayscale(1)' : r.k === 'gone' ? 'opacity:0.12;filter:grayscale(1)' : r.k === 'bad' ? 'box-shadow:0 0 0 2px #ffb020;border-radius:50%' : '';
            return `<img src="/local/svg/tfl/roundel-${r.l.i}-no-text.svg" alt="${r.l.n}" title="${r.l.n} · ${r.s}" style="width:34px;height:34px;${st}">`;
          }).join('');
          const stat = (n, label, col) => `<div style="text-align:center"><div style="font-size:28px;font-weight:700;line-height:1;color:${n ? col : 'rgba(255,255,255,0.35)'}">${n}</div><div style="margin-top:6px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,0.7)">${label}</div></div>`;
          return `<div class="tf" style="min-height:430px"><div class="tf-glow" style="background:radial-gradient(circle at 88% 0%, rgba(${glow},0.3) 0%, rgba(${glow},0) 60%)"></div>`
            + `<div class="tf-head"><span class="tf-ttl">Lines open</span><span class="tf-upd">${bad ? bad + ' disrupted' : dot + 'No disruptions'}</span></div>`
            + `<div style="position:relative;width:150px;height:150px;margin:18px auto 0"><svg width="150" height="150" viewBox="0 0 140 140" aria-hidden="true"><circle cx="70" cy="70" r="${R}" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="14"/>${segs}</svg>`
            + `<div style="position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><div style="font-size:44px;font-weight:700;line-height:1">${open}</div><div style="margin-top:5px;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.7)">open</div><div style="margin-top:2px;font-size:12px;color:rgba(255,255,255,0.55)">of ${total} lines</div></div></div>`
            + `<div style="position:relative;display:flex;justify-content:space-around;margin-top:20px">${stat(good, 'Running', '#3ddc84')}${stat(bad, 'Disrupted', '#ffb020')}${stat(closed, 'Closed', '#9fa8ff')}</div>`
            + `<div style="position:relative;margin-top:auto;padding-top:22px;display:grid;grid-template-columns:repeat(7, 1fr);gap:10px 6px;justify-items:center">${roundels}</div></div>`;
        ]]]
  ut_base:
    show_name: false
    show_icon: false
    tap_action:
      action: none
    styles:
      card:
        - background: rgb(18,20,26)
        - border: none
        - border-radius: 18px
        - box-shadow: none
        - padding: 0
        - overflow: hidden
        - height: auto
        - cursor: default
      grid:
        - grid-template-areas: '"body"'
        - grid-template-columns: minmax(0, 1fr)
      custom_fields:
        body:
          - justify-self: stretch
          - min-width: 0
    extra_styles: |
      .ut { position: relative; box-sizing: border-box; padding: 18px 22px 22px; display: flex; flex-direction: column; color: #ffffff; font-family: Roboto, system-ui, sans-serif; text-align: left; }
      .ut-glow { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; }
      .ut-head { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 30px; }
      .ut-ttl { display: flex; align-items: center; gap: 10px; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.7); white-space: nowrap; }
      .ut-ico { display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,0.12); }
      .ut-upd { display: flex; align-items: center; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.7); white-space: nowrap; }
      .ut-dw { position: relative; display: inline-block; width: 8px; height: 8px; margin-right: 7px; flex: none; }
      .ut-dr, .ut-dc { position: absolute; top: 0; left: 0; width: 8px; height: 8px; border-radius: 50%; box-sizing: border-box; }
      .ut-dr { border: 2px solid #3ddc84; animation: ut-ring 6s ease-out infinite; }
      .ut-dc { background: #3ddc84; box-shadow: 0 0 8px rgba(61,220,132,0.9); animation: ut-beat 6s ease-in-out infinite; }
      .ut-hero { position: relative; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 14px; margin-top: 18px; }
      .ut-bigm { font-size: 52px; font-weight: 700; line-height: 1; letter-spacing: -1px; }
      .ut-cap { margin-top: 8px; font-size: 13px; color: rgba(255,255,255,0.7); }
      .ut-proj { text-align: right; }
      .ut-projv { display: flex; align-items: center; justify-content: flex-end; gap: 8px; font-size: 30px; font-weight: 700; line-height: 1; }
      .ut-projv svg { color: #3ddc84; }
      .ut-mp { width: 92px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.16); margin-left: 12px; overflow: hidden; }
      .ut-mp i { display: block; height: 100%; border-radius: 2px; background: rgba(255,255,255,0.85); }
      .ut-sbar { position: relative; display: flex; gap: 3px; height: 14px; border-radius: 7px; overflow: hidden; margin-top: auto; }
      .ut-sbar i { display: block; height: 100%; }
      .ut-sbar::after { content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 22%; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.45), rgba(255,255,255,0)); animation: ut-sweep 7s ease-in-out infinite; }
      .ut-barw { position: relative; margin-top: auto; padding-top: 18px; }
      .ut-leg { position: relative; display: flex; flex-wrap: wrap; gap: 8px 26px; margin-top: 12px; }
      .ut-lg { display: flex; align-items: center; gap: 9px; font-size: 13px; color: rgba(255,255,255,0.78); white-space: nowrap; }
      .ut-lg i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
      .ut-lg b { font-weight: 600; color: #ffffff; }
      .ut-trow { position: relative; display: flex; align-items: center; gap: 14px; margin-top: 16px; min-height: 64px; }
      .ut-tico { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; flex: none; }
      .ut-tn { font-size: 17px; font-weight: 700; }
      .ut-ts { margin-top: 3px; font-size: 13px; color: rgba(255,255,255,0.7); }
      .ut-tr { margin-left: auto; display: flex; align-items: baseline; gap: 5px; }
      .ut-tr b { font-size: 36px; font-weight: 700; line-height: 1; }
      .ut-tr span { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.7); }
      .ut-bigc { position: relative; margin-top: 16px; font-size: 46px; font-weight: 700; line-height: 1; letter-spacing: -1px; }
      .ut-tiles { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: auto; padding-top: 18px; }
      .ut-tiles.t3 { grid-template-columns: 1fr 1fr 1fr; }
      .ut-tile { background: rgba(255,255,255,0.07); border-radius: 14px; padding: 11px 14px; min-width: 0; }
      .ut-tl { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .ut-tv { margin-top: 5px; font-size: 22px; font-weight: 700; line-height: 1.1; }
      .ut-tsub { margin-top: 2px; font-size: 12px; color: rgba(255,255,255,0.66); }
      .ut-zap { position: absolute; left: -4%; top: 70px; width: 108%; height: 70px; opacity: 0.5; pointer-events: none; }
      .ut-zap path { fill: none; stroke: #ffb020; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 60 340; animation: ut-zap 4.5s linear infinite; }
      .ut-flick { animation: ut-flick 3.2s ease-in-out infinite; }
      .ut-ember { position: absolute; bottom: -6px; width: 4px; height: 4px; border-radius: 50%; background: #ffb27a; box-shadow: 0 0 6px rgba(255,122,69,0.9); opacity: 0; animation: ut-rise 7s ease-in infinite; pointer-events: none; }
      .ut-wv { position: absolute; left: 0; bottom: 0; width: 200%; height: 64px; animation: ut-wave 11s linear infinite; pointer-events: none; }
      .ut-wv2 { height: 54px; animation-duration: 7.5s; animation-direction: reverse; }
      @media (max-width: 520px) {
        .ut-bigm { font-size: 40px; }
        .ut-projv { font-size: 24px; }
      }
      @keyframes ut-ring { 0% { transform: scale(1); opacity: 0.75; } 16% { transform: scale(3); opacity: 0; } 100% { transform: scale(3); opacity: 0; } }
      @keyframes ut-beat { 0%, 100% { transform: scale(1); } 6% { transform: scale(1.25); } 14% { transform: scale(1); } }
      @keyframes ut-sweep { from { transform: translateX(-120%); } to { transform: translateX(480%); } }
      @keyframes ut-zap { from { stroke-dashoffset: 400; } to { stroke-dashoffset: 0; } }
      @keyframes ut-flick { 0%, 100% { opacity: 1; } 12% { opacity: 0.78; } 24% { opacity: 0.95; } 40% { opacity: 0.72; } 58% { opacity: 1; } 74% { opacity: 0.82; } }
      @keyframes ut-rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 0.8; } 100% { transform: translateY(-230px) translateX(14px); opacity: 0; } }
      @keyframes ut-wave { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  ut_energy:
    triggers_update: [sensor.electricity_cost_this_month, sensor.gas_cost_this_month, sensor.electricity_usage_this_month, sensor.gas_usage_this_month]
    custom_fields:
      body: |
        [[[
          const num = (v) => { const x = parseFloat(v); return isNaN(x) ? 0 : x; };
          const st = (id) => states[id] ? states[id].state : undefined;
          const pick = (re) => { const k = Object.keys(states).find(id => re.test(id)); return k ? states[k].state : undefined; };
          const d = new Date();
          const day = d.getDate();
          const dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
          const e = num(st('sensor.electricity_cost_this_month'));
          const g = num(st('sensor.gas_cost_this_month'));
          const W = 56;
          const total = e + g + W;
          const pct = (x) => total > 0 ? Math.round(x / total * 100) : 0;
          const gbp = (x) => '£' + x.toFixed(2);
          const dot = '<span class="ut-dw"><span class="ut-dr"></span><span class="ut-dc"></span></span>';
          const elec = variables.kind === 'elec';
          const cost = elec ? e : g;
          const use = num(st(elec ? 'sensor.electricity_usage_this_month' : 'sensor.gas_usage_this_month'));
          const yc = num(pick(elec ? /^sensor\.octopus_energy_electricity_.*_previous_accumulative_cost$/ : /^sensor\.octopus_energy_gas_.*_previous_accumulative_cost$/));
          const yu = num(pick(elec ? /^sensor\.octopus_energy_electricity_.*_previous_accumulative_consumption$/ : /^sensor\.octopus_energy_gas_.*_previous_accumulative_consumption_kwh$/));
          const col = elec ? '#ffb020' : '#ff7a45';
          const rgb = elec ? '255,176,32' : '255,122,69';
          const fx = elec
            ? '<svg class="ut-zap" viewBox="0 0 440 70" preserveAspectRatio="none" aria-hidden="true"><path d="M0 40 L70 40 L84 14 L100 62 L116 30 L130 40 L220 40 L234 20 L250 56 L264 40 L440 40"/></svg>'
            : [[12, 0, 7], [28, 2.2, 8], [47, 4.1, 6.5], [63, 1.3, 7.5], [78, 5.2, 8.5], [90, 3.3, 7]].map(a => `<i class="ut-ember" style="left:${a[0]}%;animation-delay:-${a[1]}s;animation-duration:${a[2]}s"></i>`).join('');
          const tile = (l, v, s) => `<div class="ut-tile"><div class="ut-tl">${l}</div><div class="ut-tv">${v}</div>${s ? '<div class="ut-tsub">' + s + '</div>' : ''}</div>`;
          return `<div class="ut" style="min-height:310px"><div class="ut-glow${elec ? '' : ' ut-flick'}" style="background:radial-gradient(circle at 90% 6%, rgba(${rgb},0.34) 0%, rgba(${rgb},0) 58%)"></div>${fx}`
            + `<div class="ut-head"><span class="ut-ttl"><span class="ut-ico" style="color:${col}"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="${elec ? 'M7,2V13H10V22L17,10H13L17,2H7Z' : 'M12 2c1 3-2 5-2 8a3 3 0 0 0 6 0c0-1-.5-2-1-3 2 1.5 3 4 3 6a6 6 0 0 1-12 0c0-4 4-7 6-11z'}" fill="currentColor"/></svg></span>${elec ? 'Electricity' : 'Gas'}</span></div>`
            + `<div class="ut-bigc">${gbp(cost)}</div><div class="ut-cap" style="position:relative">This month so far · ${use.toFixed(1)} kWh</div>`
            + `<div class="ut-tiles">${tile('Yesterday', gbp(yc), yu.toFixed(1) + ' kWh')}${tile('Daily average', gbp(cost / day), '')}${tile('Projected month', gbp(cost / day * dim), '')}${tile('Share of bills', pct(cost) + '%', 'this month')}</div></div>`;
        ]]]
  ut_hero:
    triggers_update: [sensor.electricity_cost_this_month, sensor.gas_cost_this_month, sensor.electricity_usage_this_month, sensor.gas_usage_this_month]
    custom_fields:
      body: |
        [[[
          const num = (v) => { const x = parseFloat(v); return isNaN(x) ? 0 : x; };
          const st = (id) => states[id] ? states[id].state : undefined;
          const pick = (re) => { const k = Object.keys(states).find(id => re.test(id)); return k ? states[k].state : undefined; };
          const d = new Date();
          const day = d.getDate();
          const dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
          const e = num(st('sensor.electricity_cost_this_month'));
          const g = num(st('sensor.gas_cost_this_month'));
          const W = 56;
          const total = e + g + W;
          const pct = (x) => total > 0 ? Math.round(x / total * 100) : 0;
          const gbp = (x) => '£' + x.toFixed(2);
          const dot = '<span class="ut-dw"><span class="ut-dr"></span><span class="ut-dc"></span></span>';
          const month = d.toLocaleDateString('en-GB', {month: 'long'});
          const proj = (e + g) / day * dim + W;
          const pe = pct(e), pg = pct(g), pw = total > 0 ? 100 - pe - pg : 0;
          return `<div class="ut" style="min-height:230px"><div class="ut-glow" style="background:radial-gradient(circle at 12% 0%, rgba(255,176,32,0.24) 0%, rgba(255,176,32,0) 48%), radial-gradient(circle at 55% 0%, rgba(255,122,69,0.18) 0%, rgba(255,122,69,0) 46%), radial-gradient(circle at 100% 6%, rgba(77,163,255,0.26) 0%, rgba(77,163,255,0) 52%)"></div>`
            + `<div class="ut-head"><span class="ut-ttl">Utilities · ${month}</span><span class="ut-upd">Day ${day} of ${dim}<span class="ut-mp"><i style="width:${(day / dim * 100).toFixed(0)}%"></i></span></span></div>`
            + `<div class="ut-hero"><div><div class="ut-bigm">${gbp(total)}</div><div class="ut-cap">Bills this month · includes £${W} water</div></div>`
            + `<div class="ut-proj"><div class="ut-projv"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M16,6L18.29,8.29L13.41,13.17L9.41,9.17L2,16.59L3.41,18L9.41,12L13.41,16L19.71,9.71L22,12V6H16Z" fill="currentColor"/></svg>${gbp(proj)}</div><div class="ut-cap">Projected month total</div></div></div>`
            + `<div class="ut-barw"><div class="ut-sbar"><i style="flex:${e};background:#ffb020"></i><i style="flex:${g};background:#ff7a45"></i><i style="flex:${W};background:#4da3ff"></i></div></div>`
            + `<div class="ut-leg"><span class="ut-lg"><i style="background:#ffb020"></i>Electricity <b>${gbp(e)} · ${pe}%</b></span><span class="ut-lg"><i style="background:#ff7a45"></i>Gas <b>${gbp(g)} · ${pg}%</b></span><span class="ut-lg"><i style="background:#4da3ff"></i>Water <b>${gbp(W)} · ${pw}%</b></span></div></div>`;
        ]]]
